name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install FFmpeg (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg --no-progress -y

      - name: Build
        run: go build ./...

      # Lint step uses go vet (standard Go tooling) instead of external linters like golangci-lint.
      # This is an intentional trade-off for reduced external dependencies and faster CI.
      # Coverage is narrower (no style/convention checks), but covers critical bugs and type issues.
      # See README for details on linting scope and rationale.
      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test ./... -v -race -timeout 120s
